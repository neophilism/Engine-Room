name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engine_room
          POSTGRES_PASSWORD: engine_room_test
          POSTGRES_DB: engine_room_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U engine_room -d engine_room_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENGINE_ROOM_TEST_DATABASE_URL: postgresql://engine_room:engine_room_test@localhost:5432/engine_room_test
      ENGINE_ROOM_BROWSER_DATABASE_URL: postgresql://engine_room:engine_room_test@localhost:5432/engine_room_browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:migrations
      - run: npm run test:roadmap
      - run: npm run test
      - run: npm run build
      - run: node scripts/create-browser-test-db.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

