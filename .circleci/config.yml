version: 2.1

# Full migration of .github/workflows/ci.yml: PostgreSQL integration,
# type/lint, migrations/roadmap, unit tests, Next build and real Playwright.
jobs:
  full-verification:
    docker:
      - image: cimg/node:22.23.3-browsers
      - image: cimg/postgres:16.10
        environment:
          POSTGRES_USER: engine_room
          POSTGRES_PASSWORD: engine_room_test
          POSTGRES_DB: engine_room_test
    resource_class: large
    environment:
      CI: "true"
      ENGINE_ROOM_TEST_DATABASE_URL: postgresql://engine_room:engine_room_test@127.0.0.1:5432/engine_room_test
      ENGINE_ROOM_BROWSER_DATABASE_URL: postgresql://engine_room:engine_room_test@127.0.0.1:5432/engine_room_browser
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run:
          name: Install exact lockfile dependencies
          command: npm ci
      - run:
          name: TypeScript checks
          command: npm run typecheck
      - run:
          name: Lint source files
          command: npm run lint
      - run:
          name: Migration invariants
          command: npm run test:migrations
      - run:
          name: Roadmap import contracts
          command: npm run test:roadmap
      - run:
          name: All automated unit and integration tests
          command: npm run test
      - run:
          name: Build release application
          command: npm run build
      - run:
          name: Prepare separate browser integration database
          command: node scripts/create-browser-test-db.mjs
      - run:
          name: Install Playwright Chromium and Linux dependencies
          command: npx playwright install --with-deps chromium
      - run:
          name: Real browser end-to-end journeys
          command: npm run test:browser
      - store_artifacts:
          path: test-results
          destination: browser-test-results

  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate E2EESA status record (integrity only, not certification)
          command: python3 scripts/validate_e2eesa_status.py

workflows:
  full-ci:
    jobs:
      - full-verification
      - security-status-record
